services:
  db:
    image: postgres:15-alpine
    container_name: approteiros_db
    environment:
      POSTGRES_USER: approteiros_user
      POSTGRES_PASSWORD: approteiros_password
      POSTGRES_DB: approteiros_db
    ports:
      - "5433:5432" # Porta mapeada para o host (evita conflito com o local se 5432 estiver em uso)
    volumes:
      - approteiros_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: approteiros_api
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    volumes:
      - approteiros_uploads:/app/uploads
    restart: unless-stopped

  # Opcional. A API no host fala com localhost:9000; não sobe no `up` padrão.
  # docker compose --profile minio up -d
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    container_name: approteiros_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - approteiros_minio:/data

  minio-init:
    image: minio/mc:latest
    profiles: ["minio"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb -p local/image-bank || true;
      exit 0;
      "

volumes:
  approteiros_pgdata:
  approteiros_uploads:
  approteiros_minio:
